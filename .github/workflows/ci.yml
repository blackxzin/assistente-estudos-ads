name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: assistente
          POSTGRES_PASSWORD: assistente
          POSTGRES_DB: assistente_estudos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistente"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql+asyncpg://assistente:assistente@localhost:5432/assistente_estudos"
      JWT_SECRET: "ci-secret"
      IA_PROVEDOR: "falso"
      EMBEDDING_PROVEDOR: "falso"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Migrações (alembic)
        working-directory: backend
        run: alembic upgrade head

      - name: Testes e cobertura (pytest)
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing
